<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo — Sign In</title>
<link rel="stylesheet" href="../echo.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="../ggwave.js"></script>
<script>
(function() {
  const savedTheme = localStorage.getItem('echo-theme');
  document.documentElement.setAttribute('data-theme', savedTheme || 'light');
})();
</script>
<style>
/* ── Clean Login View Styles ── */
.auth-box {
  max-width: 420px;
  margin: 40px auto 0;
}

.brand-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 24px;
}

.brand-header .wave {
  margin-bottom: 12px;
}

.auth-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0 0 6px;
  color: var(--fg);
  transition: all 0.3s ease;
}

.auth-sub {
  font-size: 14px;
  color: var(--muted);
  margin: 0;
  text-align: center;
  transition: all 0.3s ease;
}

/* Match Code Card */
.match-card {
  margin: 20px 0;
  padding: 24px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.05);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

.match-card.connected {
  border-color: var(--ok);
  background: rgba(16, 185, 129, 0.04);
  box-shadow: 0 12px 35px -5px rgba(16, 185, 129, 0.25);
  transform: scale(1.03);
}

.match-code-val {
  font-size: 52px;
  font-weight: 900;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 4px;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 8px;
  transition: color 0.3s ease, transform 0.3s ease;
}

.match-card.connected .match-code-val {
  color: var(--ok);
  transform: scale(1.08);
}

.match-caption {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  transition: color 0.3s ease;
}

.match-card.connected .match-caption {
  color: var(--ok);
  font-weight: 700;
}

/* Radar & Ultrasonic Shockwave Animation */
.radar-ring {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.radar-ring .pulse-wave {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--accent);
  animation: radar-pulse 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
  opacity: 0;
}

.radar-ring .pulse-wave:nth-child(2) {
  animation-delay: 0.6s;
}

.radar-ring .pulse-wave:nth-child(3) {
  animation-delay: 1.2s;
}

@keyframes radar-pulse {
  0% { transform: scale(0.6); opacity: 0.8; }
  100% { transform: scale(1.6); opacity: 0; }
}

.radar-icon-center {
  width: 48px;
  height: 48px;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
  z-index: 2;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── Connection Bloom & Shockwave ── */
.radar-ring.connected .radar-icon-center {
  background: var(--ok);
  transform: scale(1.18);
  box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5);
}

.radar-ring.connected .pulse-wave {
  animation: none;
  opacity: 0;
}

.shockwave {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 3px solid var(--ok);
  opacity: 0;
  pointer-events: none;
}

.radar-ring.connected .shockwave {
  animation: shockwave-expand 0.9s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes shockwave-expand {
  0% { transform: scale(0.4); opacity: 1; }
  50% { opacity: 0.8; }
  100% { transform: scale(2.2); opacity: 0; }
}

/* Sparkle Particles */
.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: none;
}

.radar-ring.connected .particles {
  display: block;
}

.particle {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  top: 50%;
  left: 50%;
  opacity: 0;
}

.radar-ring.connected .particle:nth-child(1) { animation: spark-1 0.7s ease-out forwards; }
.radar-ring.connected .particle:nth-child(2) { animation: spark-2 0.7s ease-out forwards; }
.radar-ring.connected .particle:nth-child(3) { animation: spark-3 0.7s ease-out forwards; }
.radar-ring.connected .particle:nth-child(4) { animation: spark-4 0.7s ease-out forwards; }

@keyframes spark-1 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-42px, -38px) scale(0); opacity: 0; } }
@keyframes spark-2 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(40px, -36px) scale(0); opacity: 0; } }
@keyframes spark-3 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-38px, 40px) scale(0); opacity: 0; } }
@keyframes spark-4 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(42px, 38px) scale(0); opacity: 0; } }

.auth-footer-links {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
  font-size: 13px;
  font-weight: 600;
}
</style>
</head>
<body>
<script src="../icons.js"></script>
<div class="wrap" style="padding-top: 40px; padding-bottom: 60px;">
  <div class="auth-box">

    <!-- ── State 1: Clean Username Form ── -->
    <div class="card" id="formState">
      <div class="brand-header">
        <a class="brand" href="home.html" aria-label="Echo home">
          <span class="wave anim"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="word" style="font-size: 22px;">echo</span>
        </a>
      </div>

      <h2 class="auth-title" style="text-align: center;">Welcome back</h2>
      <p class="auth-sub" style="margin-bottom: 24px;">Sign in passwordlessly with ultrasonic sound</p>

      <label for="username" style="font-size: 13px; font-weight: 700;">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="your username" spellcheck="false" autofocus
             onkeydown="if(event.key==='Enter')startLogin()" style="margin-bottom: 18px;">

      <div class="status" id="formStatus" style="margin-bottom: 12px; display: none;"></div>

      <button class="btn" id="btnContinue" onclick="startLogin()">
        <svg class="ic"><use href="#i-volume"/></svg>
        Sign in with Echo
      </button>

      <div style="margin-top: 18px; text-align: center;">
        <button class="btn ghost" style="font-size: 13px; padding: 8px 14px;" onclick="showRecovery()">
          <svg class="ic" style="width: 14px; height: 14px;"><use href="#i-mail"/></svg>
          Sign in with Email Link instead
        </button>
      </div>
    </div>

    <!-- ── State 2: Active Acoustic Handshake ── -->
    <div class="card" id="handshakeState" style="display:none;">
      <div class="brand-header">
        <div class="radar-ring" id="radarRing">
          <div class="pulse-wave"></div>
          <div class="pulse-wave"></div>
          <div class="pulse-wave"></div>
          <div class="shockwave"></div>
          <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
          </div>
          <div class="radar-icon-center" id="radarIcon">
            <svg class="ic" id="radarSvg" style="width: 22px; height: 22px;"><use href="#i-volume"/></svg>
          </div>
        </div>
        <h2 class="auth-title" id="handshakeTitle">Listening for Echo…</h2>
        <p class="auth-sub" id="handshakeSub">Hold your phone near your computer</p>
      </div>

      <!-- Match Code Display -->
      <div class="match-card" id="matchCard">
        <div class="match-code-val" id="matchNum">--</div>
        <div class="match-caption" id="matchCaption">Confirm this 2-digit code on your phone</div>
      </div>

      <div class="status" id="handshakeStatus" style="margin: 0 0 16px; text-align: center;"></div>

      <!-- Action Buttons -->
      <div id="handshakeActions" style="display: flex; gap: 10px;">
        <button class="btn ghost" id="btnReplay" style="flex: 1; padding: 12px;" onclick="retransmit()">
          <svg class="ic" style="width: 15px; height: 15px;"><use href="#i-refresh"/></svg>
          Replay Sound
        </button>
        <button class="btn ghost" style="flex: 1; padding: 12px;" onclick="cancelLogin()">
          Cancel
        </button>
      </div>
    </div>

    <!-- ── State 3: Magic Link Recovery ── -->
    <div class="card" id="recoveryCard" style="display:none">
      <div class="brand-header">
        <a class="brand" href="home.html" aria-label="Echo home">
          <span class="wave anim"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="word" style="font-size: 22px;">echo</span>
        </a>
      </div>

      <h2 class="auth-title" style="text-align: center;">Email Sign-in</h2>
      <p class="auth-sub" style="margin-bottom: 20px;">We'll send a single-use sign-in link to your email</p>

      <label for="rUsernameOrEmail" style="font-size: 13px; font-weight: 700;">Username or Email</label>
      <input type="text" id="rUsernameOrEmail" placeholder="your username or email" spellcheck="false"
             onkeydown="if(event.key==='Enter')sendMagicLink()" style="margin-bottom: 16px;">

      <div class="status" id="rStatus" style="margin-bottom: 12px; display: none;"></div>

      <button class="btn" id="btnRecovery" onclick="sendMagicLink()">
        <svg class="ic"><use href="#i-mail"/></svg>
        Send Sign-in Link
      </button>

      <div style="margin-top: 14px; text-align: center;">
        <button class="btn ghost" style="font-size: 13px; padding: 8px 14px;" onclick="hideRecovery()">
          Back to sound sign-in
        </button>
      </div>
    </div>

    <!-- Bottom Account Link -->
    <div class="auth-footer-links">
      <span style="color: var(--muted);">New to Echo?</span>
      <a class="text" href="signup.html" style="color: var(--accent); font-weight: 700;">Create an account</a>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ggwave = null, context = null, instance = null;
let session = null, ws = null, txTimer = null, startedAt = 0;

if (typeof ggwave_factory !== 'undefined') {
  ggwave_factory().then(g => { ggwave = g; });
}

function ensureAudio() {
  if (!context) {
    context = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    const p = ggwave.getDefaultParameters();
    p.sampleRateInp = context.sampleRate;
    p.sampleRateOut = context.sampleRate;
    instance = ggwave.init(p);
  }
  if (context.state === 'suspended') context.resume();
}

function convertTypedArray(src, type) {
  const buffer = new ArrayBuffer(src.byteLength);
  new src.constructor(buffer).set(src);
  return new type(buffer);
}

async function matchCode(nonce) {
  const enc = new TextEncoder().encode(nonce);
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', enc));
  return String((hash[0] % 90) + 10);
}

async function startLogin() {
  const username = $('username').value.trim();
  const formStatus = $('formStatus');
  formStatus.style.display = 'none';

  if (!username) {
    formStatus.className = 'status bad';
    formStatus.textContent = 'Please enter your username first';
    formStatus.style.display = 'block';
    return;
  }
  if (!ggwave) {
    formStatus.className = 'status';
    formStatus.textContent = 'Sound engine is initializing… please wait a moment';
    formStatus.style.display = 'block';
    return;
  }

  ensureAudio();
  startedAt = Date.now();
  $('btnContinue').disabled = true;

  let r;
  try {
    r = await fetch('/api/login/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
  } catch {
    $('btnContinue').disabled = false;
    formStatus.className = 'status bad';
    formStatus.textContent = 'Cannot reach the server — check connection';
    formStatus.style.display = 'block';
    return;
  }

  if (!r.ok) {
    $('btnContinue').disabled = false;
    const err = (await r.json().catch(() => ({}))).error || r.status;
    formStatus.className = 'status bad';
    formStatus.textContent = err === 'unknown user or no enrolled device'
      ? 'No account found for that username. Please register first.'
      : 'Sign-in error: ' + err;
    formStatus.style.display = 'block';
    return;
  }

  session = await r.json();
  session.match = await matchCode(session.nonce);

  // Transition to clean Handshake state
  $('formState').style.display = 'none';
  $('handshakeState').style.display = 'block';
  $('matchNum').textContent = session.match;
  $('matchCard').classList.remove('connected');
  $('radarRing').classList.remove('connected');
  $('radarSvg').innerHTML = '<use href="#i-volume"/>';
  $('matchCaption').textContent = 'Confirm this 2-digit code on your phone';
  $('handshakeTitle').textContent = 'Listening for Echo…';
  $('handshakeSub').textContent = 'Hold your phone near your computer';
  $('handshakeStatus').textContent = '';
  $('handshakeStatus').className = 'status';
  $('handshakeActions').style.display = 'flex';

  openSocket();
  transmitNonce();
}

function cancelLogin() {
  clearTimeout(txTimer);
  if (ws) { ws.close(); ws = null; }
  session = null;
  $('btnContinue').disabled = false;
  $('handshakeState').style.display = 'none';
  $('formState').style.display = 'block';
}

function openSocket() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws?session=' + session.sessionId);
  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'authenticated') {
      clearTimeout(txTimer);
      const r = await fetch('/api/session/claim', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: session.sessionId, claimToken: msg.claimToken })
      });
      if (r.ok) {
        // Trigger Cool Connection Bloom & Shockwave Animation
        $('radarRing').classList.add('connected');
        $('matchCard').classList.add('connected');
        $('radarSvg').innerHTML = '<use href="#i-check"/>';
        $('matchCaption').textContent = `✓ Code ${session.match} Verified`;
        $('handshakeTitle').textContent = 'Device Connected!';
        $('handshakeSub').textContent = 'Signature confirmed · Opening dashboard…';
        $('handshakeActions').style.display = 'none';

        setTimeout(() => location.href = 'dashboard.html', 1100);
      } else {
        fail('Could not complete sign-in. Please try again.');
      }
    }
  };
  ws.onerror = () => {};
}

function transmitNonce() {
  if (!session) return;

  $('handshakeTitle').textContent = 'Transmitting sound…';
  $('handshakeSub').textContent = 'Playing ultrasonic handshake';

  // Default to ULTRASOUND_NORMAL (18–20 kHz)
  const waveform = ggwave.encode(instance, 'E1:' + session.nonce, ggwave.ProtocolId.GGWAVE_PROTOCOL_ULTRASOUND_NORMAL, 25);
  const f32 = convertTypedArray(waveform, Float32Array);
  const buf = context.createBuffer(1, f32.length, context.sampleRate);
  buf.getChannelData(0).set(f32);

  const src = context.createBufferSource();
  src.buffer = buf;
  src.connect(context.destination);

  src.onended = () => {
    if ($('radarRing').classList.contains('connected')) return;
    $('handshakeTitle').textContent = 'Awaiting Approval';
    $('handshakeSub').textContent = 'Tap Approve on your phone to sign in';
    $('handshakeStatus').textContent = '';

    clearTimeout(txTimer);
    const remainingTime = Math.max(5000, session.ttlMs - (Date.now() - startedAt));
    txTimer = setTimeout(() => {
      if (!$('radarRing').classList.contains('connected')) {
        fail('Session timed out. Tap "Replay Sound" or cancel to try again.');
      }
    }, remainingTime);
  };

  src.start(0);
}

function retransmit() {
  if (session) {
    clearTimeout(txTimer);
    transmitNonce();
  }
}

function fail(msg) {
  clearTimeout(txTimer);
  $('handshakeStatus').className = 'status bad';
  $('handshakeStatus').textContent = msg;
}

function showRecovery() {
  $('formState').style.display = 'none';
  $('handshakeState').style.display = 'none';
  $('recoveryCard').style.display = 'block';
  $('rUsernameOrEmail').focus();
}

function hideRecovery() {
  $('recoveryCard').style.display = 'none';
  $('formState').style.display = 'block';
}

async function sendMagicLink() {
  const val = $('rUsernameOrEmail').value.trim();
  const st = $('rStatus');
  st.style.display = 'none';

  if (!val) {
    st.className = 'status bad';
    st.textContent = 'Please enter your username or email';
    st.style.display = 'block';
    return;
  }

  $('btnRecovery').disabled = true;
  st.className = 'status';
  st.textContent = 'Sending sign-in link…';
  st.style.display = 'block';

  try {
    const r = await fetch('/api/recovery/send-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usernameOrEmail: val })
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) {
      st.className = 'status ok';
      st.textContent = 'Link sent! Check your inbox.';
    } else {
      st.className = 'status bad';
      st.textContent = data.error || 'Failed to send magic link';
    }
  } catch {
    st.className = 'status bad';
    st.textContent = 'Cannot reach server';
  } finally {
    $('btnRecovery').disabled = false;
  }
}
</script>
</body>
</html>
