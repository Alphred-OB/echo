<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo — Create Account</title>
<link rel="stylesheet" href="../echo.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="../qrcode.js"></script>
<script>
(function() {
  const savedTheme = localStorage.getItem('echo-theme');
  document.documentElement.setAttribute('data-theme', savedTheme || 'light');
})();
</script>
<style>
.auth-box {
  max-width: 420px;
  margin: 40px auto 0;
}

.brand-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}

.brand-header .wave {
  margin-bottom: 12px;
}

.auth-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0 0 6px;
  color: var(--fg);
  text-align: center;
}

.auth-sub {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 20px;
  text-align: center;
}

/* Minimalist QR Frame */
.qr-container {
  display: flex;
  justify-content: center;
  margin: 16px 0;
}

.qr-card {
  padding: 16px;
  background: #ffffff;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.06);
  display: inline-block;
  line-height: 0;
}

.qr-card img {
  border-radius: 8px;
}

/* Minimal Status Line */
.live-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin: 4px auto 16px;
}

.beacon-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6);
  animation: pulse-beacon 1.8s infinite;
}

@keyframes pulse-beacon {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
}

.subtle-actions {
  display: flex;
  justify-content: center;
  gap: 16px;
  font-size: 13px;
  font-weight: 600;
  margin-top: 12px;
}

.auth-footer-links {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
  font-size: 13px;
  font-weight: 600;
}
</style>
</head>
<body>
<script src="../icons.js"></script>
<div class="wrap" style="padding-top: 40px; padding-bottom: 60px;">
  <div class="auth-box">

    <!-- ── Step 1: Account Info ── -->
    <div class="card" id="step1">
      <div class="brand-header">
        <a class="brand" href="home.html" aria-label="Echo home">
          <span class="wave anim"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="word" style="font-size: 22px;">echo</span>
        </a>
      </div>

      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Set up your passwordless acoustic profile</p>

      <label for="username" style="font-size: 13px; font-weight: 700;">Username</label>
      <input type="text" id="username" placeholder="e.g. kwame" autocomplete="off" spellcheck="false" autofocus
             onkeydown="if(event.key==='Enter')document.getElementById('email').focus()" style="margin-bottom: 14px;">
      <div class="hint" id="userHint" style="margin-top: -8px; margin-bottom: 12px;"></div>

      <label for="email" style="font-size: 13px; font-weight: 700;">Email Address</label>
      <input type="email" id="email" placeholder="e.g. kwame@example.com" autocomplete="off" spellcheck="false"
             onkeydown="if(event.key==='Enter')signup()" style="margin-bottom: 18px;">
      <div class="hint" id="emailHint" style="margin-top: -12px; margin-bottom: 12px;"></div>

      <div class="status" id="formStatus" style="margin-bottom: 14px; display: none;"></div>

      <button class="btn" id="btnNext" onclick="signup()">
        Continue
      </button>
    </div>

    <!-- ── Step 2: Clean QR Code Pairing ── -->
    <div class="card" id="step2" style="display:none">
      <div class="brand-header">
        <a class="brand" href="home.html" aria-label="Echo home">
          <span class="wave anim"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="word" style="font-size: 22px;">echo</span>
        </a>
      </div>

      <h2 class="auth-title">Pair Security Key</h2>
      <p class="auth-sub">Scan the code below with your Echo Key app</p>

      <!-- QR Code -->
      <div class="qr-container">
        <div class="qr-card" id="qrBox"></div>
      </div>

      <!-- Clean Live Status Indicator -->
      <div style="text-align: center;">
        <div class="live-status" id="waitStatus">
          <span class="beacon-dot"></span>
          <span>Waiting for phone…</span>
        </div>
      </div>

      <!-- Subtle Action Links -->
      <div class="subtle-actions">
        <button type="button" class="btn-link" id="btnCopy" onclick="copyEnrollLink()" style="background:none;border:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;">
          <span id="copyLabel">Copy pairing link</span>
        </button>
        <span style="color:var(--border);">·</span>
        <button type="button" class="btn-link" onclick="window.open(enrollUrl,'_blank')" style="background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;">
          Open on this computer
        </button>
      </div>

      <div style="text-align: center; margin-top: 18px;">
        <button type="button" class="btn ghost" onclick="backToStep1()" style="font-size: 13px; padding: 6px 14px;">
          Back
        </button>
      </div>
    </div>

    <!-- ── Step 3: Success ── -->
    <div class="card" id="step3" style="display:none; text-align: center;">
      <div class="brand-header">
        <a class="brand" href="home.html" aria-label="Echo home">
          <span class="wave anim"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="word" style="font-size: 22px;">echo</span>
        </a>
      </div>

      <div style="width: 56px; height: 56px; background: var(--ok-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--ok);">
        <svg class="ic" style="width: 32px; height: 32px;"><use href="#i-check"/></svg>
      </div>

      <h2 class="auth-title">You're all set, <span id="doneName"></span>!</h2>
      <p class="auth-sub" style="margin-bottom: 24px;">Your phone is now registered as your physical security key.</p>

      <button class="btn" onclick="location.href='login.html'">
        <svg class="ic"><use href="#i-volume"/></svg>
        Sign in with Echo
      </button>
    </div>

    <!-- Bottom Account Link -->
    <div class="auth-footer-links">
      <span style="color: var(--muted);">Already have an account?</span>
      <a class="text" href="login.html" style="color: var(--accent); font-weight: 700;">Sign in</a>
    </div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let enrollUrl = '', enrollToken = '', eventSource = null;

async function signup() {
  const username = $('username').value.trim();
  const email = $('email').value.trim();
  const formStatus = $('formStatus');
  formStatus.style.display = 'none';

  if (!username) {
    formStatus.className = 'status bad';
    formStatus.textContent = 'Please choose a username';
    formStatus.style.display = 'block';
    return;
  }
  if (!email || !email.includes('@')) {
    formStatus.className = 'status bad';
    formStatus.textContent = 'Please enter a valid email address';
    formStatus.style.display = 'block';
    return;
  }

  $('btnNext').disabled = true;

  try {
    const r = await fetch('/api/signup/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email })
    });
    const data = await r.json().catch(() => ({}));

    if (!r.ok) {
      $('btnNext').disabled = false;
      formStatus.className = 'status bad';
      formStatus.textContent = data.error || 'Could not start sign-up';
      formStatus.style.display = 'block';
      return;
    }

    enrollToken = data.enrollToken;
    enrollUrl = `${location.protocol}//${location.host}/phone/phone.html?token=${enrollToken}`;

    // Render QR Code
    $('qrBox').innerHTML = '';
    new QRCode($('qrBox'), {
      text: enrollUrl,
      width: 190,
      height: 190,
      colorDark: '#0f172a',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    $('step1').style.display = 'none';
    $('step2').style.display = 'block';

    listenForEnrollment();
  } catch {
    $('btnNext').disabled = false;
    formStatus.className = 'status bad';
    formStatus.textContent = 'Network error — check connection';
    formStatus.style.display = 'block';
  }
}

function listenForEnrollment() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`/api/enroll/events?token=${enrollToken}`);

  eventSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'enrolled') {
        eventSource.close();
        $('doneName').textContent = $('username').value.trim();
        $('step2').style.display = 'none';
        $('step3').style.display = 'block';
      }
    } catch {}
  };

  eventSource.onerror = () => {};
}

function copyEnrollLink() {
  navigator.clipboard.writeText(enrollUrl).then(() => {
    $('copyLabel').textContent = 'Link copied!';
    setTimeout(() => {
      $('copyLabel').textContent = 'Copy pairing link';
    }, 2000);
  });
}

function backToStep1() {
  if (eventSource) eventSource.close();
  $('step2').style.display = 'none';
  $('step1').style.display = 'block';
  $('btnNext').disabled = false;
}
</script>
</body>
</html>
